[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sync-pastas-s3"
version = "1.0.0"
description = "Sincronização de pastas locais com o S3 guiada por configuração: mapeia os dois lados e envia só o que falta"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Bruno Maia" }]
dependencies = ["boto3>=1.34", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[s3]>=5"]

[project.scripts]
sync-s3 = "sync_s3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sync_s3 = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
